<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Clubs — Searchable Table</title>
<style>
  :root{
    --bg:#f4f6f9;
    --panel:#ffffff;
    --line:#e2e6ee;
    --line-strong:#cbd2e0;
    --text:#1d2333;
    --muted:#6b7488;
    --accent:#2f6fed;
    --accent-soft:#e8f0ff;
    --mark:#ffe27a;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,"Iranian Sans","Vazirmatn",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top bar ---------- */
  .bar{
    position:sticky; top:0; z-index:20;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    display:grid;
    grid-template-columns:1fr minmax(280px,520px) 1fr;
    gap:16px;
    align-items:center;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .title h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  .title .sub{color:var(--muted);font-size:12px}

  .searchwrap{position:relative;display:flex;align-items:center}
  .searchwrap input{
    width:100%;
    padding:11px 38px 11px 14px;
    font:inherit;
    color:var(--text);
    background:#f7f9fc;
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .searchwrap input:focus{
    background:#fff;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .searchwrap input::-webkit-search-cancel-button{display:none}
  #clear{
    position:absolute; inset-inline-end:6px;
    width:26px;height:26px;line-height:1;
    border:0;border-radius:50%;
    background:#dfe4ee;color:#4a5266;
    font-size:16px;cursor:pointer;display:none;
  }
  #clear:hover{background:#cfd6e4}
  #clear.on{display:block}

  .opts{
    display:flex;align-items:center;justify-content:flex-end;
    gap:14px;font-size:12.5px;color:var(--muted);white-space:nowrap;
  }
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .count{font-variant-numeric:tabular-nums}
  .count b{color:var(--text)}

  /* ---------- table ---------- */
  .tablewrap{
    padding:14px 18px 60px;
    overflow:auto;
    max-height:calc(100vh - 84px);
  }
  table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:1500px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    font-size:13px;
  }
  thead th{
    position:sticky; top:0; z-index:5;
    background:#eef1f7;
    color:#39415a;
    text-align:start;
    font-weight:600;
    font-size:12px;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:9px 11px;
    border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  thead th:hover{background:#e4e9f4}
  thead th .arrow{opacity:.35;font-size:10px;margin-inline-start:4px}
  thead th.sorted .arrow{opacity:1;color:var(--accent)}

  tbody td{
    padding:8px 11px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    max-width:340px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  tbody tr:nth-child(even){background:#fafbfe}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr:last-child td{border-bottom:0}

  td.col-name{font-weight:600;min-width:170px;max-width:260px}
  td.col-fields{max-width:230px;white-space:normal}
  td.col-address{max-width:280px;white-space:normal;color:#3b4358}
  td.col-description{max-width:300px;white-space:normal;color:#3b4358}
  td.col-metadata{
    max-width:340px;white-space:normal;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;color:#6b7488;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  td.col-id,td.col-rating,td.col-reviews_count,td.col-latitude,td.col-longitude{
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  td.col-source_url a{color:var(--accent);text-decoration:none}
  td.col-source_url a:hover{text-decoration:underline}

  .null{color:#b8bfd0}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

  table.hide-meta .col-metadata{display:none}

  .empty{
    text-align:center;color:var(--muted);
    padding:48px 16px;font-size:14px;
  }
  .empty span{display:block;font-size:24px;margin-bottom:8px;opacity:.5}

  .footnote{
    color:var(--muted);font-size:11.5px;
    padding:10px 18px 0;
  }
  @media (max-width:900px){
    .bar{grid-template-columns:1fr;gap:10px}
    .opts{justify-content:flex-start}
    .tablewrap{max-height:none}
  }
</style>
</head>

<script>
(function () {
  'use strict';

  /* =========================================================

  function splitTuples(s) {
    var rows = [], cur = '', depth = 0, inStr = false, i = 0, ch;

      ch = s[i];
      if (inStr) {
        cur += ch;
        if (ch === "'") {
          if (s[i + 1] === "'") { cur += "'"; i += 2; continue; }
          inStr = false;
        }
        i++; continue;
      }
      if (ch === "'") { inStr = true; cur += ch; i++; continue; }
      if (ch === '(' || ch === '[') {
        depth++;
        if (depth === 1) cur = ''; else cur += ch;
        i++; continue;
      }
      if (ch === ')' || ch === ']') {
        depth--;
        if (depth === 0) { rows.push(cur); cur = ''; }
        else cur += ch;
        i++; continue;
      }
      if (depth >= 1) cur += ch;
      i++;
    }
    return rows;
  }

  function splitFields(t) {
    var out = [], cur = '', depth = 0, inStr = false, i = 0, ch;
    while (i < t.length) {
      ch = t[i];
      if (inStr) {
        if (ch === "'") {
          if (t[i + 1] === "'") { cur += "''"; i += 2; continue; }
          inStr = false; cur += ch; i++; continue;
        }
        cur += ch; i++; continue;
      }
      if (ch === "'") { inStr = true; cur += ch; i++; continue; }
      if (ch === '(' || ch === '[') { depth++; cur += ch; i++; continue; }
      if (ch === ')' || ch === ']') { depth--; cur += ch; i++; continue; }
      if (ch === ',' && depth === 0) { out.push(cur.trim()); cur = ''; i++; continue; }
      cur += ch; i++;
    }
    out.push(cur.trim());
    return out;
  }

  function unquote(s) {
    s = s.trim();
    if (s.length >= 2 && s.charAt(0) === "'" && s.charAt(s.length - 1) === "'") {
      return s.slice(1, -1).replace(/''/g, "'");
    }
    return s;
  }

  function convert(v) {
    var t = v.trim();
    if (/^null$/i.test(t)) return null;
    if (/^ARRAY\s*\[/i.test(t) && t.charAt(t.length - 1) === ']') {

      return splitFields(inner).map(unquote).filter(function (x) { return x !== ''; });

  function parseSQL(sql) {

  var FOLD = {
    'ي': 'ی', 'ى': 'ی', 'ك': 'ک', 'ة': 'ه', 'ۀ': 'ه',
    'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا', 'ؤ': 'و', 'ئ': 'ی',
    '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4',
    '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9',
    '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
    '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9',

  };

    return { i: idx, values: vals, tr: tr, tds: tds, hay: null };

  /* pre-compute the searchable haystack once */
  records.forEach(function (rec) {
    rec.hay = normalize(rec.values.map(function (v) {

      return String(v);
    }).join(' \u0001 '));
  });

  /* =========================================================
     4. RENDERING
     ========================================================= */

  function displayValue(col, v) {
    if (v === null || v === undefined || v === '') return { text: '', html: '<span class="null">—</span>' };
    if (Array.isArray(v)) return { text: v.join('، '), html: escapeHtml(v.join('، ')) };
    return { text: String(v), html: escapeHtml(String(v)) };
  }

  function highlight(text, terms) {
    if (!terms.length || !text) return escapeHtml(text);
    var n = normalize(text);
    var ranges = [];
    for (var t = 0; t < terms.length; t++) {
      var term = terms[t];

    }
    out += escapeHtml(text.slice(pos));
    return out;
  }

  function renderRow(rec, terms, withHighlight) {
    for (var c = 0; c < COLUMNS.length; c++) {
      var col = COLUMNS[c];
      var v = rec.values[c];
      var td = rec.tds[c];
      var dv = displayValue(col, v);

      if (!withHighlight || !dv.text) {

  /* =========================================================

  var currentTerms = [];

  var timer = null;
  function onInput() {

  /* ---- sorting ---- */
  function colIndex(col) { return COLUMNS.indexOf(col); }

  function compare(a, b) {
    var ci = colIndex(sortCol);
    var va = a.values[ci], vb = b.values[ci];
    var aNull = (va === null || va === undefined || va === '');
    var bNull = (vb === null || vb === undefined || vb === '');
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;

    if (NUMERIC[sortCol]) {
      var na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
    }
    var sa = Array.isArray(va) ? va.join(' ') : String(va);
    var sb = Array.isArray(vb) ? vb.join(' ') : String(vb);
    return sa.localeCompare(sb, 'fa') * sortDir;
  }

  function toggleSort(col) {
    if (sortCol === col) sortDir = -sortDir;
    else { sortCol = col; sortDir = 1; }

    Array.prototype.forEach.call(headEl.children, function (th) {
      th.classList.toggle('sorted', th.dataset.col === col);
      var ar = th.querySelector('.arrow');
      if (ar) ar.textContent = (th.dataset.col === col)
        ? (sortDir === 1 ? '▲' : '▼') : '▲▼';
    });

    var sorted = records.slice().sort(compare);
    var frag = document.createDocumentFragment();
    sorted.forEach(function (r) { frag.appendChild(r.tr); });
    bodyEl.appendChild(frag);
  }

  /* ---- metadata column toggle ---- */
  metaEl.addEventListener('change', function () {
    tableEl.classList.toggle('hide-meta', !metaEl.checked);
  });

  /* ---- go ---- */
  apply();
})();
</script>
</body>
