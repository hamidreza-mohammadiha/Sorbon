<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باشگاه مشتریان فروشگاه‌ها</title>
    
    <!-- Vazirmatn Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
        /* Utility class for LTR content inside RTL layout */
        .dir-ltr {
            direction: ltr;
        }
        /* Custom scrollbar for admin table */
        .overflow-x-auto::-webkit-scrollbar {
            height: 6px;
        }
        .overflow-x-auto::-webkit-scrollbar-thumb {
            background: #008080;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-10 relative">

    <!-- Header Section (Profile) -->
    <header class="bg-white p-4 shadow-sm border-b border-gray-200 sticky top-0 z-20">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-teal-50 rounded-full flex items-center justify-center text-2xl border border-teal-100">
                    🏪
                </div>
                <div>
                    <h1 class="font-bold text-base text-gray-900">فروشگاه سپهر</h1>
                    <p class="text-xs text-gray-500 mt-0.5">آقای سپهر قاسمی - تهران، خیابان ولیعصر</p>
                    <p class="text-xs text-gray-500 mt-0.5 dir-ltr text-right">۰۹۱۲۳۴۵۶۷۸۹</p>
                </div>
            </div>
            <!-- Burger Menu Button -->
            <button id="menu-btn" class="p-2 text-2xl text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                ☰
            </button>
        </div>
    </header>

    <!-- Back-end / Admin Panel (Hidden by default) -->
    <div id="admin-panel" class="hidden bg-white p-4 border-b border-gray-300 shadow-inner sticky top-[88px] z-10 max-h-[60vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-teal-700 flex items-center gap-2">
                <span>⚙️</span> پنل مدیریت (تغییر مقادیر سفارشات)
            </h2>
            <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">هفته جاری: ۳۰</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-right min-w-[500px]">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="p-2 font-medium">محصول</th>
                        <th class="p-2 font-medium">هفته ۱</th>
                        <th class="p-2 font-medium">هفته ۲</th>
                        <th class="p-2 font-medium">هفته ۳</th>
                        <th class="p-2 font-medium text-teal-700">هفته ۳۰ (جاری)</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Table rows generated via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Suggestion Section -->
    <section class="p-4 mt-2">
        <h2 class="font-bold mb-3 flex items-center gap-2 text-gray-800">
            <span>✨</span> پیشنهاد محصولات منتخب:
        </h2>
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-transform hover:scale-105">
                <span class="text-3xl mb-1">🍫</span>
                <span class="text-xs font-medium text-center text-gray-700">شکلات تخته‌ای</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-transform hover:scale-105">
                <span class="text-3xl mb-1">🧁</span>
                <span class="text-xs font-medium text-center text-gray-700">کاپ‌کیک</span>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-transform hover:scale-105">
                <span class="text-3xl mb-1">🍬</span>
                <span class="text-xs font-medium text-center text-gray-700">آبنبات</span>
            </div>
        </div>
    </section>

    <!-- Milestone Progress Bar Section -->
    <section class="p-4 bg-white mx-4 rounded-xl shadow-sm border border-gray-100 mb-4">
        <div class="flex justify-between items-center mb-2">
            <h2 class="font-bold text-sm text-gray-800 flex items-center gap-2">
                <span>🏆</span> پیشرفت افزایش سفارش (هدف: ۱۰ کالا)
            </h2>
            <span id="milestone-text" class="text-sm font-bold text-teal-700 dir-ltr">۰ / ۱۰</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-4 flex overflow-hidden" dir="ltr">
            <div id="milestone-bar" class="bg-[#008080] h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
    </section>

    <!-- Previous Purchases Section -->
    <section class="px-4">
        <h2 class="font-bold mb-3 flex items-center gap-2 text-gray-800">
            <span>📋</span> تاریخچه سفارشات
        </h2>
        <div id="orders-list" class="space-y-3">
            <!-- Order items generated via JavaScript -->
        </div>
    </section>

    <script>
        // ==========================================
        // Data Generation: >20 Confectionery Items
        // ==========================================
        const MAX_QTY = 50; // Maximum quantity for progress bar scaling
        const TARGET_MILESTONE = 10; // Goal for increasing orders

        const productNames = [
            "شکلات تخته‌ای", "آبنبات", "آبنبات چوبی", "کاپ‌کیک", "دونات", 
            "بیسکویت", "کیک", "پای", "پودینگ", "عسل", 
            "شیر", "شکلات صبحانه", "پاستیل", "آدامس", "مافین", 
            "پیراشکی", "ویفر", "رولت", "تارت", "ژله", 
            "مربا", "کاکائو", "شکلات تلخ", "شکلات سفید", "شکلات شیری"
        ];
        
        const productEmojis = [
            "🍫", "🍬", "🍭", "🧁", "🍩", 
            "🍪", "🍰", "🥧", "🍮", "🍯", 
            "🥛", "🍫", "🍬", "🍭", "🧁", 
            "🍩", "🍪", "🍰", "🥧", "🍮", 
            "🍯", "🥛", "🍫", "🍬", "🍭"
        ];

        // Initialize products with random mock data for weeks 1, 2, 3, and 30
        const productsData = productNames.map((name, i) => ({
            id: i + 1,
            name,
            emoji: productEmojis[i],
            w1: Math.floor(Math.random() * 20) + 5,  // Week 1
            w2: Math.floor(Math.random() * 20) + 5,  // Week 2
            w3: Math.floor(Math.random() * 20) + 5,  // Week 3 (Previous)
            w30: Math.floor(Math.random() * 30) + 5, // Week 30 (Current)
        }));

        // ==========================================
        // Core Functions
        // ==========================================

        // Render the main dashboard (Milestone + Orders List)
        function renderDashboard() {
            // 1. Calculate Milestone Progress
            const increasedCount = productsData.filter(p => p.w30 > p.w3).length;
            const milestonePercent = Math.min((increasedCount / TARGET_MILESTONE) * 100, 100);
            
            const milestoneText = document.getElementById('milestone-text');
            const milestoneBar = document.getElementById('milestone-bar');
            
            milestoneText.innerText = `${increasedCount} / ۱۰`;
            milestoneBar.style.width = `${milestonePercent}%`;

            // 2. Render Orders List
            const ordersList = document.getElementById('orders-list');
            ordersList.innerHTML = '';

            productsData.forEach(product => {
                const prev = product.w3; // Previous purchase (Week 3)
                const current = product.w30; // Current purchase (Week 30)
                
                // Calculate percentages for progress bar
                const prevPercent = Math.min((prev / MAX_QTY) * 100, 100);
                const diffPercent = current > prev ? Math.min(((current - prev) / MAX_QTY) * 100, 100 - prevPercent) : 0;

                const isIncreased = current > prev;
                const checkIcon = isIncreased ? '✅' : '⭕'; // Green check or empty circle

                const html = `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center gap-3">
                        <span class="text-2xl w-8 text-center">${product.emoji}</span>
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-800">${product.name}</span>
                                <span class="text-xs text-gray-500 dir-ltr bg-gray-50 px-2 py-0.5 rounded">${prev} → ${current}</span>
                            </div>
                            <!-- Progress Bar (LTR direction) -->
                            <div class="w-full bg-gray-100 rounded-full h-3 flex overflow-hidden relative" dir="ltr">
                                <!-- Light Pistachio: Previous amount -->
                                <div class="bg-[#D4E6B5] h-3" style="width: ${prevPercent}%"></div>
                                <!-- Teal Green: Extra amount ordered -->
                                <div class="bg-[#008080] h-3 transition-all duration-300" style="width: ${diffPercent}%"></div>
                            </div>
                        </div>
                        <span class="text-xl">${checkIcon}</span>
                    </div>
                `;
                ordersList.insertAdjacentHTML('beforeend', html);
            });
        }

        // Render the Back-end Admin Table
        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';

            productsData.forEach((product, index) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-100 hover:bg-gray-50 transition-colors';
                tr.innerHTML = `
                    <td class="p-2 text-xs text-gray-700 whitespace-nowrap">${product.emoji} ${product.name}</td>
                    <td class="p-2"><input type="number" value="${product.w1}" data-index="${index}" data-week="w1" class="w-14 p-1 border border-gray-300 rounded text-center dir-ltr focus:outline-none focus:border-teal-500"></td>
                    <td class="p-2"><input type="number" value="${product.w2}" data-index="${index}" data-week="w2" class="w-14 p-1 border border-gray-300 rounded text-center dir-ltr focus:outline-none focus:border-teal-500"></td>
                    <td class="p-2"><input type="number" value="${product.w3}" data-index="${index}" data-week="w3" class="w-14 p-1 border border-gray-300 rounded text-center dir-ltr focus:outline-none focus:border-teal-500"></td>
                    <td class="p-2"><input type="number" value="${product.w30}" data-index="${index}" data-week="w30" class="w-14 p-1 border border-teal-500 rounded text-center dir-ltr focus:outline-none focus:ring-1 focus:ring-teal-500 bg-teal-50/30"></td>
                `;
                tbody.appendChild(tr);
            });

            // Add event listeners to inputs for real-time updates
            tbody.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const index = e.target.getAttribute('data-index');
                    const week = e.target.getAttribute('data-week');
                    const value = parseInt(e.target.value) || 0;
                    
                    // Update data model
                    productsData[index][week] = value;
                    
                    // Re-render dashboard to reflect changes
                    renderDashboard();
                });
            });
        }

        // ==========================================
        // Initialization & Event Listeners
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            // Initial render
            renderDashboard();
            renderAdminTable();

            // Burger Menu Toggle Logic
            const menuBtn = document.getElementById('menu-btn');
            const adminPanel = document.getElementById('admin-panel');
            
            menuBtn.addEventListener('click', () => {
                adminPanel.classList.toggle('hidden');
                // Change icon state slightly for UX
                if (adminPanel.classList.contains('hidden')) {
                    menuBtn.innerHTML = '☰';
                    menuBtn.classList.remove('bg-gray-100');
                } else {
                    menuBtn.innerHTML = '✕';
                    menuBtn.classList.add('bg-gray-100');
                }
            });
        });
    </script>
</body>
</html>
